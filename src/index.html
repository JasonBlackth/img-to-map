<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>img-to-map</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32-medium-outline.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png" />
  </head>
  <body>
    <h1>Create Fantasy Maps from your own Images</h1>
    <div class="spinner-border text-light" role="status" id="openCvLoadingIndicator">
      <span class="visually-hidden">Loading...</span>
    </div>
    <app-root></app-root>
    <script>
      window.openCvReady = new Promise((resolve) => {
        window.Module = {
          onRuntimeInitialized() {
            resolve();
          },
        };
      });
    </script>
    <script
      async
      src="opencv.js"
      onload="window.openCvReady = Promise.resolve()"
      type="text/javascript"
    ></script>
  </body>
</html>
