<div id="{{ id }}Container">
  <table id="{{ id }}Heading">
    <tr>
      <td>
        <h2>{{ headingText }}</h2>
      </td>
      <td class="collapse-toggle">
        <a
          data-bs-toggle="collapse"
          href="#{{ id }}"
          role="button"
          (click)="toggleCollapse()"
          aria-expanded="{{ !isCollapsed }}"
          aria-controls="{{ id }}"
        >
          <img
            alt="Toggle editor"
            src="collapse-icon.svg"
            class="collapse-icon"
            [class.collapsed]="isCollapsed"
          />
        </a>
      </td>
    </tr>
  </table>
  <div class="editor collapse" id="{{ id }}">
    <div class="left">
      <canvas id="{{ id }}Canvas" tabindex="0" #editorCanvas (click)="handleCanvasClick($event)">
      </canvas>
    </div>
    <div class="right">
      <ng-content></ng-content>
    </div>
  </div>
</div>
