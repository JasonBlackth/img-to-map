<div class="editor-container container" id="{{ editorId }}-container">
  <div class="row" id="{{ editorId }}-heading">
    <div class="col-11">
      <h2>{{ headingText }}</h2>
    </div>
    <div class="col-1 collapse-toggle">
      <a
        data-bs-toggle="collapse"
        href="#{{ editorId }}"
        role="button"
        (click)="toggleCollapse()"
        aria-expanded="{{ !isCollapsed }}"
        aria-controls="{{ editorId }}"
      >
        <img
          alt="Toggle editor"
          src="icons/collapse.svg"
          class="collapse-icon"
          [class.collapsed]="isCollapsed"
        />
      </a>
    </div>
  </div>
  <div class="editor collapse" id="{{ editorId }}">
    <div class="left">
      <div class="canvas-container">
        <canvas
          id="{{ editorId }}-canvas"
          tabindex="0"
          #editorCanvas
          (click)="handleCanvasClick($event)"
        >
        </canvas>
      </div>
    </div>
    <div class="right">
      <ng-content></ng-content>
    </div>
  </div>
</div>
