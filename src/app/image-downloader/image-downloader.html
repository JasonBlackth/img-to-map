<h2>Download Image</h2>
<div class="editor">
  <div class="left">
    <canvas id="imageDownloadCanvas" #editorCanvas> </canvas>
  </div>
  <div class="right">
    <label for="imageStyleSelect">Image Style</label>
    <br />
    <select
      id="imageStyleSelect"
      [ngModel]="imageStyleSelected"
      (ngModelChange)="onStyleChange($event)"
    >
      <option value="BINARY">Binary</option>
      <option value="CLASSIC">Classic</option>
      <option value="VINTAGE">Vintage</option>
    </select>
    <br />
    <button class="btn btn-secondary" (click)="resetRandomSeeds()">Reset Random Seeds</button>
    <br />
    <button class="btn btn-primary" (click)="downloadImage()">Download Image</button>
  </div>
</div>
