<base-editor-component editorId="image-downloader" headingText="Download Image">
  <label for="imageStyleSelect">Image Style</label>
  <br />
  <select
    id="imageStyleSelect"
    [ngModel]="imageStyleSelected"
    (ngModelChange)="onStyleChange($event)"
  >
    <option value="BINARY">Binary</option>
    <option value="CLASSIC">Classic</option>
    <option value="VINTAGE">Vintage</option>
  </select>
  <br />
  <button (click)="resetRandomSeeds()">
    <img class="icon" src="icons/dice.svg" />
    Reset Random Seeds
  </button>
  <br />
  <button (click)="downloadImage()">
    <img class="icon" src="icons/download.svg" />
    Download Image
  </button>
</base-editor-component>
