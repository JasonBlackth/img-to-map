<h2>Prepare Image</h2>
<div class="editor">
    <div class="left">
        <canvas
          id="editor1canvas"
          #editorCanvas
          (mousemove)="onMouseOverCanvas($event)">
        </canvas>
    </div>
    <div class="right">
      <slider
        id="brightnessSlider"
        [min]="-128" [max]="128"
        [value]="brightness"
        (valueChange)="setProperty('brightness', $event)"
        >Brightness</slider>
      <slider
        id="contrastSlider"
        [min]="0.5" [max]="3" [step]="0.01"
        [value]="contrast"
        (valueChange)="setProperty('contrast', $event)"
        >Contrast
      </slider>
      <slider
        id="contrastCenterSlider"
        [min]="0" [max]="255"
        [value]="contrastCenter"
        (valueChange)="setProperty('contrastCenter', $event)"
        >Contrast Center
      </slider>
      <slider
        id="denoiseAmountSlider"
        [min]="0" [max]="255"
        [value]="denoiseAmount"
        (valueChange)="setProperty('denoiseAmount', $event)"
        >Denoise Amount
      </slider>
      <button (click)="applyClahe()">Apply CLAHE</button>
      <button (click)="extractForeground()">Extract Foreground</button>
      <button (click)="iterExtractForeground()">New iteration</button>
      <button (click)="adaptiveThres()">Adaptive Thresholding</button>
      <div>
        <label for="DenoiseMode">Denoise Mode:</label>
        <select id="DenoiseMode" name="denoiseMode" [ngModel]="_denoiseMode" (ngModelChange)="setDenoiseMode($event)">
          <option value="NONE">None</option>
          <option value="MEDIUM">Medium</option>
          <option value="HIGH">High</option>
        </select>
      </div>
    </div>
</div>
