<h2>Adaptive Threshold</h2>
<div class="editor">
    <div class="left">
        <canvas
          id="editor1canvas"
          #editorCanvas>
        </canvas>
    </div>
    <div class="right">
      <slider
        id="sampleSizeSlider"
        [min]="1" [max]="100" [step]="2"
        [value]="sampleSize"
        (valueChange)="setProperty('sampleSize', $event)"
        >Sample Size
      </slider>
      <slider
        id="addedConstantSlider"
        [min]="0" [max]="15"
        [value]="addedConstant"
        (valueChange)="setProperty('addedConstant', $event)"
        >Added Constant
      </slider>
      <slider
        id="dilationItersSlider"
        [min]="0" [max]="15"
        [value]="dilationIters"
        (valueChange)="setProperty('dilationIters', $event)"
        >Dilation
      </slider>
      <slider
        id="erosionItersSlider"
        [min]="0" [max]="15"
        [value]="erosionIters"
        (valueChange)="setProperty('erosionIters', $event)"
        >Erosion
      </slider>
    </div>
</div>
