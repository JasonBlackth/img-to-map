<div>   
    <h2>Find Contours</h2>
    <div float="left">
        <canvas
          id="editor2canvas"
          tabindex="0"
          #editorCanvas
          (click)="onCanvasClicked($event)">
        </canvas>
    </div>
    <div>
        <label for="lowThreshold">
            Low Threshold: {{ previewLowThreshold }}
        </label>
        <input type="range"
            id="lowThreshold"
            name="lowThreshold"
            min="0" max="255"
            [value]="previewLowThreshold"
            (input)="onDragLowThreshold($event.target.value)"
            (change)="setLowThreshold()"/>
        <label for="highThreshold">
            High Threshold: {{ previewHighThreshold }}
        </label>
        <input type="range"
            id="highThreshold"
            name="highThreshold"
            min="0" max="255"
            [value]="previewHighThreshold"
            (input)="onDragHighThreshold($event.target.value)"
            (change)="setHighThreshold()"/>
        <button (click)="deleteSelectedContours()">Delete Selected</button>
    </div>
</div>
