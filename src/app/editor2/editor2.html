<h2>Select Contours</h2>
<div class="editor">   
    <div class="left">
        <canvas
          id="editor2canvas"
          tabindex="0"
          #editorCanvas
          (click)="onCanvasClicked($event)">
        </canvas>
    </div>
    <div class="right">
        <button (click)="deleteSelectedContours()">Delete Selected</button>
        <br>
        <button (click)="keepOnlySelected()">Keep Only Selection</button>
    </div>
</div>
