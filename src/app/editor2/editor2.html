<h2>Find Contours</h2>
<div class="editor">   
    <div class="left">
        <canvas
          id="editor2canvas"
          tabindex="0"
          #editorCanvas
          (click)="onCanvasClicked($event)">
        </canvas>
    </div>
    <div class="right">
        <slider
            id="lowThresholdSlider"
            [min]="0"
            [max]="500"
            [value]="lowThreshold"
            (valueChange)="setProperty('lowThreshold', $event)"
            >Low Threshold</slider>
        <slider
            id="highThresholdSlider"
            [min]="0"
            [max]="500"
            [value]="highThreshold"
            (valueChange)="setProperty('highThreshold', $event)"
        >High Threshold</slider>
        <button (click)="deleteSelectedContours()">Delete Selected</button>
    </div>
</div>
