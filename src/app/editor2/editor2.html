<base-editor-component
  (myKeydown)="handleKeydown($event)"
  (canvasClick)="handleCanvasClick($event)"
  headingText="Select Contours"
  editorId="editor2"
>
  <button (click)="deleteSelectedContours()">
    <img class="icon" src="icons/bin.svg" />
    Delete Selected
  </button>
  <br />
  <button (click)="keepOnlySelected()">
    <img class="icon" src="icons/checkmark.svg" />
    Keep Only Selection
  </button>
</base-editor-component>
