<ng-template #fileInput>
  <input
    hidden
    type="file"
    (change)="onFileUpload($event)"
    [accept]="acceptedImageTypes.join(',')"
  />
</ng-template>
<ng-template #fileDropArea>
  <div
    class="file-drop-area"
    (drop)="onFileDrop($event)"
    (dragover)="onDragOver($event)"
    [hidden]="isFilePresent()"
  >
    <label class="input-label">
      <img class="icon" id="upload-icon" src="icons/add.svg" alt="" />
      <br />
      <strong>Upload Image</strong>
      <ng-container *ngTemplateOutlet="fileInput"></ng-container>
    </label>
    <br />
    or drag and drop a file here
  </div>
</ng-template>

<ng-template #uploadedImageDisplay>
  <div class="uploaded-image-container container">
    <table style="width: 100%">
      <tr>
        <td style="width: 0%">
          <img id="uploaded-image-display" [src]="fileUrl" [hidden]="isImageLoading()" />
          <div
            id="uploaded-image-loading-spinner"
            class="spinner-border text-light"
            [hidden]="!isImageLoading()"
            role="status"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </td>
        <td>
          <strong>Uploaded Image</strong>
          <br />
          {{ fileName }}
        </td>
        <td style="text-align: right">
          <label class="upload-new-label input-label">
            <img class="icon" id="upload-new-icon" src="icons/upload.svg" alt="" />
            Upload New
            <ng-container *ngTemplateOutlet="fileInput"></ng-container>
          </label>
        </td>
      </tr>
    </table>
  </div>
</ng-template>

<ng-template #warningDisplay>
  <div
    id="warning-div"
    class="alert alert-warning fade show"
    role="alert"
    style="display: flex; flex-direction: row"
  >
    <img id="warning-icon" src="icons/bootstrap-warning.svg" />
    <div>
      <h4 class="alert-heading">Warning</h4>
      <p>{{ warningMessage }}</p>
    </div>
    <button type="button" class="close-alert" aria-label="Close" (click)="closeWarning()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</ng-template>

<div>
  @if (!isFilePresent()) {
    <ng-container *ngTemplateOutlet="fileDropArea"></ng-container>
    @if (isWarningVisible) {
      <ng-container *ngTemplateOutlet="warningDisplay"></ng-container>
    }
  } @else {
    <ng-container *ngTemplateOutlet="uploadedImageDisplay"></ng-container>
  }
</div>
