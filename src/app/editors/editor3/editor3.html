<base-editor-component editorId="editor3" headingText="Edit Coastlines" (editorExpanded)="emitEditorExpanded()">
  <slider
    id="coastlineSmoothnessSlider"
    [min]="0"
    [max]="50"
    [value]="coastlineSmoothness"
    (valueChange)="setProperty('coastlineSmoothness', $event)"
    >Coastline Smoothness
  </slider>
  <button (click)="makeCoastlinesJagged()">Make Coastlines Jagged</button>
</base-editor-component>
