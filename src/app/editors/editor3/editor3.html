<base-editor-component
  editorId="editor3"
  headingText="Edit Coastlines"
  (editorExpanded)="emitEditorExpanded()"
>
  <slider
    id="coastlineSmoothnessSlider"
    [min]="0"
    [max]="50"
    [value]="coastlineSmoothness"
    (valueChange)="changePropertyAction('coastlineSmoothness', $event)"
    >Coastline Smoothness
  </slider>
</base-editor-component>
