<base-editor-component editorId="image-downloader" headingText="Download Image">
  <label for="image-style-select">Image Style</label>
  <br />
  <select
    id="image-style-select"
    [ngModel]="imageStyleSelected"
    (ngModelChange)="setProperty('imageStyleSelected', $event)"
  >
    <option value="BINARY">Binary</option>
    <option value="CLASSIC">Classic</option>
    <option value="VINTAGE">Vintage</option>
  </select>
  <br />
  <button (click)="resetRandomSeeds()">
    <img class="icon" src="icons/dice.svg" />
    Reset Random Seeds
  </button>
  <br />
  <label id="download-format-label" for="download-format-select"> Format: </label>
  <select id="download-format-select" [(ngModel)]="downloadFormat">
    <option value="image/jpeg">JPEG</option>
    <option value="image/png">PNG</option>
  </select>
  <button (click)="downloadImage()">
    <img class="icon" src="icons/download.svg" />
    Download Map
  </button>
</base-editor-component>
