<ng-template #dilationSlider>
  <slider
    id="dilationItersSlider"
    [min]="0"
    [max]="15"
    [value]="dilationIters"
    (valueChange)="setProperty('dilationIters', $event)"
    >Dilation
  </slider>
</ng-template>
<ng-template #erosionSlider>
  <slider
    id="erosionItersSlider"
    [min]="0"
    [max]="15"
    [value]="erosionIters"
    (valueChange)="setProperty('erosionIters', $event)"
    >Erosion
  </slider>
</ng-template>

<base-editor-component
  editorId="editor1"
  headingText="Adaptive Threshold"
  (editorExpanded)="emitEditorExpanded()"
>
  <slider
    id="sampleSizeSlider"
    [min]="3"
    [max]="2500"
    [step]="2"
    [value]="sampleSize"
    (valueChange)="setProperty('sampleSize', $event)"
    >Sample Size
  </slider>
  <slider
    id="shiftThresholdSlider"
    [min]="-15"
    [max]="15"
    [value]="shiftThreshold"
    (valueChange)="setProperty('shiftThreshold', $event)"
    >Shift Threshold
  </slider>
  <label>
    <input
      type="checkbox"
      id="isResultInvertedCheckbox"
      [checked]="isResultInverted"
      (change)="setProperty('isResultInverted', $event.target.checked)"
      class="clickable"
    />
    Invert Result
  </label>
  <ng-container *ngTemplateOutlet="isDilationFirst ? dilationSlider : erosionSlider"></ng-container>
  <div class="slider-container">
    <button (click)="toggleIsDilationFirst()" style="margin: auto">
      <img class="icon" src="icons/swap.svg" />
      Swap
    </button>
  </div>
  <ng-container *ngTemplateOutlet="isDilationFirst ? erosionSlider : dilationSlider"></ng-container>
</base-editor-component>
