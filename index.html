<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>img-to-map</title>
</head>
<body>
    <h2>img-to-map</h2>
    <p id="status">OpenCV.js is loading...</p>
    <img id="imageSrc" alt="No Image" />
    <div class="caption">
        Upload Image:
        <input type="file" id="fileInput" name="file"/>
        <img id="uploadedImage" hidden/>
    </div>
    <div id="editor1" hidden>
        <h2>Prepare Image</h2>
        <label for="Contrast">Contrast:</label>
        <input type="range" id="Contrast" name="contrast" min="0" max="255" value="0"/>
        <label for="ContrastCentre">Contrast Centre:</label>
        <input type="range" id="ContrastCentre" name="contrastCentre" min="0" max="255" value="128"/>
        <label for="DenoiseMode">Denoise Mode:</label>
        <select id="DenoiseMode" name="denoiseMode">
            <option value="NONE">None</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
        </select>
    </div>
    <div id="editor2" hidden>
        <h2>Find Contours</h2>
        <label for="lowThreshold">Low Threshold:</label>
        <input type="range" id="lowThreshold" name="lowThreshold" min="0" max="255" value="100"/>
        <label for="highThreshold">High Threshold:</label>
        <input type="range" id="highThreshold" name="highThreshold" min="0" max="255" value="200"/>
        
    </div>
    <div id="editor3">
        Editor 3
    </div>

    <div id="downloadWindow">
        Download Window
        <canvas id="downloadWindowCanvas"></canvas>
    </div>




      <script src="./dist/main.js"  type="module"></script>  
      <script async src="opencv.js" type="text/javascript"></script>
</body>
</html>
